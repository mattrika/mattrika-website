name: Deploy Nx Angular App to GitHub Pages

on:
    push:
        branches:
            - main

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: 'pages'
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  run_install: false

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build and Prerender Nx App
              run: pnpm exec nx build mattrika-web --configuration=production --base-href=/

            - name: Add 404.html and CNAME for Angular SPA Routing & Custom Domain
              run: |
                  cp dist/apps/mattrika-web/browser/index.csr.html dist/apps/mattrika-web/browser/404.html
                  echo "mattrika.com" > dist/apps/mattrika-web/browser/CNAME

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: 'dist/apps/mattrika-web/browser'

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
