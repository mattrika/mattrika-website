name: Deploy Nx Angular App to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/setup@v1
        with:
          version: 12
          runtime: node@24
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and Prerender Nx App
        run: pnpm exec nx build mattrika-web --configuration=production --base-href=/mattrika-website/

      - name: Add 404.html for Angular SPA Routing
        run: cp dist/apps/mattrika-web/browser/index.html dist/apps/mattrika-web/browser/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v7
        with:
          path: 'dist/apps/mattrika-web/browser'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
