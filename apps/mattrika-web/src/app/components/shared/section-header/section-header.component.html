<div class="mx-auto max-w-3xl text-center">
    <span
        class="reveal-init reveal-delay-1 font-tight border-line bg-surface text-ink inline-flex items-center gap-2 rounded-full border px-3.5 py-1.5 text-xs font-semibold tracking-tight shadow-2xs"
    >
        <span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>
        {{ badge() }}
    </span>
    <h2
        class="reveal-init reveal-delay-2 font-tight text-ink mt-5 text-3xl leading-[1.12] font-bold tracking-tight text-balance sm:text-4xl lg:text-5xl"
    >
        {{ title() }}
    </h2>
    <p
        class="reveal-init reveal-delay-3 font-tight text-ink-soft mx-auto mt-4 max-w-2xl text-base leading-relaxed text-pretty sm:text-lg"
    >
        {{ description() }}
    </p>
</div>
