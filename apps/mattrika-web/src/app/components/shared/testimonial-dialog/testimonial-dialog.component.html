<div class="-mr-6 max-h-[85vh] overflow-y-auto pr-6">
    <div
        class="mb-8 flex w-fit items-center gap-3 rounded-full border border-gray-100 bg-gray-50 px-4 py-2"
    >
        <div class="flex items-center gap-0.5 text-yellow-400">
            @for (i of [1, 2, 3, 4, 5]; track i) {
                <ng-icon
                    name="lucideStar"
                    class="h-5 w-5 text-yellow-400! sm:h-6 sm:w-6 [&_svg]:fill-current"
                />
            }
        </div>
        <span class="text-sm font-bold tracking-wide text-gray-900 sm:text-base"
            >5.0</span
        >
        <div class="h-1 w-1 rounded-full bg-gray-300 sm:h-1.5 sm:w-1.5"></div>
        <span
            class="flex items-center gap-1 text-xs font-semibold tracking-wider text-gray-600 uppercase sm:gap-1.5 sm:text-sm"
        >
            <ng-icon name="lucideBadgeCheck" class="h-4 w-4 text-green-500!" />
            Verified Client
        </span>
    </div>

    <div class="mb-10 space-y-6 text-lg leading-relaxed text-gray-700">
        @for (paragraph of testimonial.fullText; track paragraph) {
            <p>{{ paragraph }}</p>
        }
    </div>

    <div class="flex items-center gap-4 border-t border-gray-100 pt-6">
        <span
            class="bg-brand text-brand-foreground flex h-14 w-14 items-center justify-center rounded-full text-lg font-semibold shadow-sm"
        >
            {{ testimonial.avatarInitials }}
        </span>
        <div>
            <p class="text-lg font-semibold text-gray-900">
                {{ testimonial.authorName }}
            </p>
            <p class="text-base text-gray-500">{{ testimonial.authorTitle }}</p>
        </div>
    </div>
</div>
