<section id="services" class="border-border/70 border-t bg-white">
    <div class="mx-auto max-w-7xl px-4 py-20 sm:px-6 sm:py-24 lg:px-8">
        <div class="mx-auto max-w-2xl text-center">
            <span
                hlmBadge
                variant="outline"
                class="rounded-full px-4 py-1.5 text-xs font-medium"
            >
                What we do
            </span>
            <h2
                class="text-foreground mt-4 text-3xl font-semibold tracking-tight text-balance sm:text-4xl"
            >
                Everything you need to ship great software
            </h2>
            <p class="text-muted-foreground mt-4 text-base leading-7">
                One team, full ownership. From product strategy and design to
                development and ongoing operations.
            </p>
        </div>

        <div class="mt-14 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
            @for (service of services; track service.title) {
                <section
                    hlmCard
                    class="border-border/70 hover:border-brand/40 rounded-xl transition-all hover:-translate-y-0.5 hover:shadow-md"
                >
                    <div hlmCardHeader>
                        <span
                            class="bg-mist text-brand mb-2 flex h-11 w-11 items-center justify-center rounded-lg"
                        >
                            <ng-icon [name]="service.icon" class="h-5 w-5" />
                        </span>
                        <h3 hlmCardTitle class="text-base">
                            {{ service.title }}
                        </h3>
                    </div>
                    <div hlmCardContent>
                        <p class="text-muted-foreground text-sm leading-6">
                            {{ service.description }}
                        </p>
                    </div>
                </section>
            }
        </div>
    </div>
</section>
