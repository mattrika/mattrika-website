<section id="portfolio" class="border-border/70 border-t bg-white">
    <div class="mx-auto max-w-7xl px-4 py-20 sm:px-6 sm:py-24 lg:px-8">
        <app-section-header
            [badge]="sectionTitle()"
            [title]="sectionHeading()"
            [description]="sectionDescription()"
        />

        <div class="mt-14 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
            @for (project of displayedProjects(); track project.title) {
                <app-project-card
                    [project]="project"
                    (projectClick)="openProject($event)"
                />
            }
        </div>

        @if (maxProjects()) {
            <div class="mt-12 flex justify-end">
                <a
                    routerLink="/projects"
                    class="text-brand decoration-brand flex items-center gap-1 text-sm font-medium transition-all hover:underline hover:underline-offset-4"
                >
                    View all projects
                    <ng-icon name="lucideArrowUpRight" class="h-4 w-4" />
                </a>
            </div>
        }
    </div>
</section>
