<section
    hlmCard
    class="border-border/70 hover:border-brand/40 group flex h-full flex-col overflow-hidden rounded-xl pt-0! transition-all hover:-translate-y-0.5 hover:shadow-md"
>
    <div
        class="relative cursor-pointer overflow-hidden"
        (click)="onClick()"
        role="button"
        tabindex="0"
        (keydown.enter)="onClick()"
        [attr.aria-label]="'Open case study for ' + project().title"
    >
        <img
            [src]="project().thumbnail"
            [alt]="project().title"
            loading="lazy"
            class="aspect-[21/9] w-full object-cover object-top transition-transform duration-300 group-hover:scale-105"
        />
        <div
            class="bg-brand/45 pointer-events-none absolute inset-0 transition-opacity duration-300 group-hover:opacity-35"
        ></div>
        <div
            class="pointer-events-none absolute inset-0 bg-linear-to-t from-black/55 via-transparent to-transparent opacity-0 transition-opacity duration-300 group-hover:opacity-100"
        ></div>
        <span
            class="pointer-events-none absolute top-3 left-3 rounded-md bg-black/40 px-2.5 py-1 text-xs font-medium text-white backdrop-blur-sm"
        >
            {{ project().category }}
        </span>
        <button
            type="button"
            class="absolute right-3 bottom-3 flex cursor-pointer items-center gap-1.5 rounded-lg bg-black/70 px-3 py-1.5 text-xs font-medium text-white opacity-0 shadow-2xs backdrop-blur-md transition-all group-focus-within:opacity-100 group-hover:opacity-100 hover:bg-black/90 active:scale-95"
            (click)="onClick(); $event.stopPropagation()"
        >
            View case study
            <ng-icon name="lucideArrowUpRight" class="h-3.5 w-3.5" />
        </button>
    </div>

    <div
        hlmCardHeader
        class="flex-grow cursor-pointer"
        (click)="onClick()"
        role="button"
        tabindex="0"
        (keydown.enter)="onClick()"
    >
        <h3
            hlmCardTitle
            class="group-hover:text-brand text-base transition-colors"
        >
            {{ project().title }}
        </h3>
        <p hlmCardDescription class="text-sm">
            {{ project().summary }}
        </p>
    </div>

    <div hlmCardFooter class="flex-wrap gap-1.5">
        @for (tech of project().stack.slice(0, 3); track tech) {
            <span hlmBadge variant="secondary" class="rounded-full text-xs">
                {{ tech }}
            </span>
        }
    </div>
</section>
