<div class="flex max-h-[90vh] flex-col overflow-y-auto">
    <app-project-dialog-browser
        [project]="project"
        [activeImage]="activeImage()"
        [isReloading]="isReloading()"
        (imageChange)="selectImage($event)"
        (prev)="prevImage()"
        (next)="nextImage()"
        (reload)="reloadPreview()"
        (closeDialog)="close()"
    />
    <app-project-dialog-details [project]="project" (closeDialog)="close()" />
</div>
