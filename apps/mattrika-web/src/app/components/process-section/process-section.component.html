<section id="work" class="bg-mist">
    <div class="mx-auto max-w-7xl px-4 py-20 sm:px-6 sm:py-24 lg:px-8">
        <div class="mx-auto max-w-2xl text-center">
            <span
                hlmBadge
                variant="outline"
                class="rounded-full px-4 py-1.5 text-xs font-medium"
            >
                How we work
            </span>
            <h2
                class="text-foreground mt-4 text-3xl font-semibold tracking-tight text-balance sm:text-4xl"
            >
                A process built for momentum
            </h2>
            <p class="text-muted-foreground mt-4 text-base leading-7">
                From kickoff to launch (and beyond), you always know what's
                happening next.
            </p>
        </div>

        <div class="mt-14 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4">
            @for (item of process; track item.step) {
                <section hlmCard class="border-border/70 rounded-xl">
                    <div hlmCardHeader>
                        <span
                            class="text-brand font-mono text-sm font-semibold"
                        >
                            {{ item.step }}
                        </span>
                        <h3 hlmCardTitle class="text-base">
                            {{ item.title }}
                        </h3>
                    </div>
                    <div hlmCardContent>
                        <p class="text-muted-foreground text-sm leading-6">
                            {{ item.description }}
                        </p>
                    </div>
                </section>
            }
        </div>
    </div>
</section>
