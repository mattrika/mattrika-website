<section id="contact" class="bg-mist">
    <div class="mx-auto max-w-7xl px-4 py-20 sm:px-6 sm:py-24 lg:px-8">

        >
            <div
                aria-hidden="true"
                class="bg-brand/25 pointer-events-none absolute -top-24 right-0 h-96 w-96 rounded-full blur-3xl"
            ></div>

            <div class="relative mx-auto max-w-2xl">

                    class="text-3xl font-semibold tracking-tight text-balance text-white sm:text-4xl"
                >
                    Have a product in mind?
                </h2>
                <p class="mt-4 text-base leading-7 text-white/70">

                    business day with ideas you can use immediately.
                </p>
                <div
                    class="mt-10 flex flex-col items-center justify-center gap-3 sm:flex-row"
                >
                    <a
                        hlmBtn
                        size="lg"
                        href="mailto:info@mattrika.com"
                        class="w-full sm:w-auto"
                    >
                        <ng-icon name="lucideMail" class="h-4 w-4" />
                        info@mattrika.com
                    </a>
                    <a
                        hlmBtn
                        size="lg"
                        href="tel:+17742605004"
                        class="w-full sm:w-auto"
                    >
                        <ng-icon name="lucidePhone" class="h-4 w-4" />
                        (774) 260-5004
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
