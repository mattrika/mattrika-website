<footer
    class="text-ink relative isolate overflow-hidden border-t border-slate-200/90 bg-gradient-to-b from-[#f8fafc] via-[#f1f5f9] to-[#e2e8f0]"
>
    <div
        aria-hidden="true"
        class="via-brand/40 pointer-events-none absolute inset-x-0 top-0 h-[1.5px] bg-gradient-to-r from-transparent to-transparent"
    ></div>

    <div
        aria-hidden="true"
        class="bg-brand/10 pointer-events-none absolute -top-40 right-1/4 -z-10 h-96 w-96 rounded-full blur-[130px]"
    ></div>
    <div
        aria-hidden="true"
        class="pointer-events-none absolute -bottom-40 left-1/4 -z-10 h-96 w-96 rounded-full bg-teal-400/10 blur-[130px]"
    ></div>

    <div class="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:px-8">
        <div
            class="grid grid-cols-1 gap-12 sm:grid-cols-2 lg:grid-cols-12 lg:gap-8"
        >
            <app-footer-brand
                class="reveal-init reveal-delay-1 lg:col-span-5"
            />
            <app-footer-links
                class="reveal-init reveal-delay-2 lg:col-span-4 lg:col-start-6"
            />
            <app-footer-contact
                class="reveal-init reveal-delay-3 lg:col-span-3"
            />
        </div>

        <app-footer-bottom
            class="reveal-init reveal-delay-4 mt-16 block border-t border-slate-300/70 pt-8"
        />
    </div>
</footer>
