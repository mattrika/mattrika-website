<div
    class="flex flex-wrap items-center justify-center gap-x-4 gap-y-1.5 text-center sm:justify-start"
>
    <p>© {{ currentYear }} Mattrika. All rights reserved.</p>
    <span class="text-ink/30 hidden sm:inline">•</span>
    <a routerLink="/privacy" class="hover:text-brand transition-colors"
        >Privacy Policy</a
    >
    <span class="text-ink/30">•</span>
    <a routerLink="/terms" class="hover:text-brand transition-colors"
        >Terms &amp; Conditions</a
    >
</div>

<p class="hidden lg:block">Crafted with care in Northborough, Massachusetts.</p>

<button
    type="button"
    (click)="scrollToTop($event)"
    class="group text-ink/75 hover:border-brand hover:text-brand inline-flex cursor-pointer items-center gap-2 rounded-full border border-slate-300/80 bg-white/80 px-4 py-1.5 text-xs font-semibold shadow-2xs backdrop-blur-sm transition-all duration-300 hover:-translate-y-0.5 hover:bg-white hover:shadow-sm"
>
    <span>Back to top</span>
    <svg
        class="size-3.5 transition-transform duration-300 group-hover:-translate-y-0.5"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
    >
        <path d="m18 15-6-6-6 6" />
    </svg>
</button>
