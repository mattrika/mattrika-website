<h3 class="font-tight text-ink text-xs font-bold tracking-wider uppercase">
    Direct Connect
</h3>
<div class="mt-4 space-y-3">
    <a
        href="mailto:info@mattrika.com"
        class="group hover:border-brand flex items-center justify-between rounded-xl border border-slate-300/80 bg-white/70 p-3 shadow-2xs backdrop-blur-xs transition-all duration-300 hover:-translate-y-0.5 hover:bg-white hover:shadow-sm"
    >
        <div class="flex items-center gap-3">
            <div
                class="bg-brand/10 text-brand flex size-8 shrink-0 items-center justify-center rounded-lg"
            >
                <ng-icon name="lucideMail" class="size-4" />
            </div>
            <div class="min-w-0">
                <p class="font-tight text-ink text-xs font-semibold">
                    Email Us
                </p>
                <p class="font-tight text-ink/70 truncate text-xs">
                    info@mattrika.com
                </p>
            </div>
        </div>
        <ng-icon
            name="lucideArrowUpRight"
            class="text-ink/35 group-hover:text-brand size-3.5 transition-all duration-200 group-hover:translate-x-0.5 group-hover:-translate-y-0.5"
        />
    </a>

    <a
        href="tel:+17742605004"
        class="group hover:border-brand flex items-center justify-between rounded-xl border border-slate-300/80 bg-white/70 p-3 shadow-2xs backdrop-blur-xs transition-all duration-300 hover:-translate-y-0.5 hover:bg-white hover:shadow-sm"
    >
        <div class="flex items-center gap-3">
            <div
                class="bg-brand/10 text-brand flex size-8 shrink-0 items-center justify-center rounded-lg"
            >
                <ng-icon name="lucidePhone" class="size-4" />
            </div>
            <div class="min-w-0">
                <p class="font-tight text-ink text-xs font-semibold">
                    Call Directly
                </p>
                <p class="font-tight text-ink/70 truncate text-xs">
                    (774) 260-5004
                </p>
            </div>
        </div>
        <ng-icon
            name="lucideArrowUpRight"
            class="text-ink/35 group-hover:text-brand size-3.5 transition-all duration-200 group-hover:translate-x-0.5 group-hover:-translate-y-0.5"
        />
    </a>

    <div
        class="font-tight text-ink/70 flex items-center gap-2.5 px-1 pt-1 text-xs"
    >
        <ng-icon name="lucideMapPin" class="text-brand size-4 shrink-0" />
        <span>Northborough, Massachusetts, USA</span>
    </div>
</div>
