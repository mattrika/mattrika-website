<header
    class="pointer-events-none fixed inset-x-0 top-0 z-50 pt-2.5 transition-all duration-300 sm:pt-3.5"
>
    <!-- Constrained exactly to the section content width (max-w-7xl px-4 sm:px-6 lg:px-8) -->
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <!-- Floating Pill Header Container -->
        <div
            class="pointer-events-auto relative flex w-full items-center justify-between rounded-full py-2 pr-2.5 pl-4.5 backdrop-blur-2xl transition-all duration-300 sm:py-2 sm:pr-3 sm:pl-6"
            [class]="
                isScrolled()
                    ? 'text-foreground border border-white/70 bg-white/60 shadow-[0_12px_40px_-8px_rgba(13,18,32,0.12),inset_0_1px_1px_rgba(255,255,255,0.95)] backdrop-saturate-150'
                    : 'text-foreground border border-white/55 bg-white/45 shadow-[0_8px_32px_0_rgba(13,18,32,0.06),inset_0_1px_1px_rgba(255,255,255,0.9)]'
            "
        >
            <!-- Logo (Left) - Increased Size -->
            <a
                href="/"
                class="group flex shrink-0 cursor-pointer items-center py-0.5"
                (click)="handleLogoClick($event)"
                aria-label="Mattrika Home"
            >
                <img
                    src="/Mattrika_logo.svg"
                    alt="Mattrika"
                    class="h-10 w-auto transition-transform duration-300 group-hover:scale-105 sm:h-12"
                />
            </a>

            <!-- Desktop Navigation Links with Animated Hairline Underline -->
            <nav
                class="hidden items-center gap-7 md:flex lg:gap-9"
                aria-label="Main"
            >
                @for (link of navLinks; track link.id) {
                    <a
                        [href]="link.isRoute ? link.path : '#' + link.id"
                        (click)="handleLinkClick($event, link)"
                        class="group font-tight text-foreground/80 hover:text-foreground relative cursor-pointer py-1 text-[15px] font-medium transition-colors"
                    >
                        <span>{{ link.label }}</span>
                        <!-- Motion Underline -->
                        <span
                            aria-hidden="true"
                            class="bg-brand absolute -bottom-0.5 left-0 h-[2px] w-full origin-left scale-x-0 transition-transform duration-300 ease-out group-hover:scale-x-100"
                        ></span>
                    </a>
                }
            </nav>

            <!-- Right Side: Compact CTA Button (matching hero) & Mobile Toggle -->
            <div class="flex items-center gap-2">
                <a
                    href="#contact"
                    (click)="scrollTo($event, 'contact')"
                    class="nav-cta-btn group relative hidden h-[42px] items-center justify-center gap-2 overflow-hidden rounded-full px-6 text-sm font-semibold text-white transition-all duration-300 hover:scale-[1.02] active:scale-[0.97] sm:inline-flex"
                >
                    <span class="relative z-10">Let’s Work Together</span>
                    <span
                        class="absolute inset-0 -translate-x-full bg-gradient-to-r from-white/0 via-white/20 to-white/0 transition-transform duration-700 ease-in-out group-hover:translate-x-full"
                    ></span>
                </a>

                <!-- Mobile Double-Circle Toggle Button -->
                <button
                    type="button"
                    class="border-brand/30 bg-brand/10 hover:bg-brand/20 flex size-[42px] shrink-0 items-center justify-center rounded-full border transition-colors md:hidden"
                    aria-label="Toggle navigation menu"
                    [attr.aria-expanded]="mobileOpen()"
                    (click)="mobileOpen.set(!mobileOpen())"
                >
                    <span
                        class="bg-brand flex size-8 items-center justify-center rounded-full text-white shadow-xs transition-transform duration-200"
                    >
                        @if (mobileOpen()) {
                            <ng-icon name="lucideX" class="size-4" />
                        } @else {
                            <ng-icon name="lucideMenu" class="size-4" />
                        }
                    </span>
                </button>
            </div>

            <!-- Mobile Dropdown Menu (Opaque, Visible Solid Background, High Contrast) -->
            @if (mobileOpen()) {
                <div
                    class="text-foreground pointer-events-auto absolute top-full right-0 mt-3 w-72 rounded-2xl border border-border bg-white p-4 shadow-[0_20px_50px_-10px_rgba(13,18,32,0.22),0_0_0_1px_rgba(0,0,0,0.04)] transition-all md:hidden"
                    aria-label="Mobile Navigation"
                >
                    <nav class="flex flex-col gap-1">
                        @for (link of navLinks; track link.id) {
                            <a
                                [href]="
                                    link.isRoute ? link.path : '#' + link.id
                                "
                                (click)="handleLinkClick($event, link)"
                                class="font-tight text-foreground hover:text-brand flex cursor-pointer items-center rounded-xl px-3.5 py-2.5 text-[15px] font-semibold transition-colors hover:bg-slate-100/80 active:bg-slate-100"
                            >
                                {{ link.label }}
                            </a>
                        }
                    </nav>

                    <a
                        href="#contact"
                        (click)="scrollTo($event, 'contact')"
                        class="nav-cta-btn group relative mt-3.5 flex h-[42px] w-full items-center justify-center overflow-hidden rounded-full text-sm font-semibold text-white transition-all duration-300 hover:scale-[1.02] active:scale-[0.97]"
                    >
                        <span class="relative z-10">Let’s Work Together</span>
                        <span
                            class="absolute inset-0 -translate-x-full bg-gradient-to-r from-white/0 via-white/20 to-white/0 transition-transform duration-700 ease-in-out group-hover:translate-x-full"
                        ></span>
                    </a>
                </div>
            }
        </div>
    </div>
</header>
