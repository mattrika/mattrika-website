<header
    class="border-border/70 bg-background/80 sticky top-0 z-50 w-full border-b backdrop-blur-md"
>
    <div
        class="mx-auto flex h-16 w-full max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8"
    >
        <a
            href="/"
            class="flex shrink-0 cursor-pointer items-center"
            (click)="handleLogoClick($event)"
        >
            <img src="/Mattrika_logo.svg" alt="Mattrika" class="h-9 w-auto" />
        </a>

        <nav class="hidden items-center gap-1 md:flex" aria-label="Main">
            @for (link of navLinks; track link.id) {
                <a
                    [href]="link.isRoute ? link.path : '#' + link.id"
                    (click)="handleLinkClick($event, link)"
                    class="text-muted-foreground hover:bg-muted hover:text-foreground cursor-pointer rounded-md px-3 py-2 text-sm font-medium transition-colors"
                >
                    {{ link.label }}
                </a>
            }
        </nav>

        <div class="flex items-center gap-2">
            <a
                hlmBtn
                class="hidden md:inline-flex"
                href="#contact"
                (click)="scrollTo($event, 'contact')"
            >
                {{ getInTouchText }}
                <ng-icon name="lucideArrowRight" class="h-4 w-4" />
            </a>

            <button
                hlmBtn
                variant="ghost"
                size="icon"
                class="md:hidden"
                aria-label="Toggle navigation menu"
                (click)="mobileOpen.set(!mobileOpen())"
            >
                @if (mobileOpen()) {
                    <ng-icon name="lucideX" class="h-5 w-5" />
                } @else {
                    <ng-icon name="lucideMenu" class="h-5 w-5" />
                }
            </button>
        </div>
    </div>

    @if (mobileOpen()) {
        <nav
            class="border-border/70 bg-background border-t px-4 py-3 md:hidden"
            aria-label="Mobile"
        >
            <div class="flex flex-col gap-1">
                @for (link of navLinks; track link.id) {
                    <a
                        [href]="link.isRoute ? link.path : '#' + link.id"
                        (click)="handleLinkClick($event, link)"
                        class="text-muted-foreground hover:bg-muted hover:text-foreground cursor-pointer rounded-md px-3 py-2.5 text-sm font-medium transition-colors"
                    >
                        {{ link.label }}
                    </a>
                }
                <a
                    hlmBtn
                    class="mt-2"
                    href="#contact"
                    (click)="scrollTo($event, 'contact')"
                >
                    {{ getInTouchText }}
                    <ng-icon name="lucideArrowRight" class="h-4 w-4" />
                </a>
            </div>
        </nav>
    }
</header>
